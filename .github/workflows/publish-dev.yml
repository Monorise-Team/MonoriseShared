name: Publish dev versions

# Każde wypchnięcie na dev publikuje wersje testowe wszystkich paczek z oznaczeniem `dev`, np. 0.1.1-dev.42
# (następna poprawka z numerem przebiegu). Gałęzie dev produktów mogą z nich korzystać (ADR-0087).
# Wersje ustawiamy tylko w CI, bez commitu.

on:
  push:
    branches: [dev]

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-dev
  cancel-in-progress: false

jobs:
  publish:
    name: Publish dev versions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@monorise-team"
      - run: pnpm install --frozen-lockfile
      - id: version
        run: echo "version=$(node scripts/set-version.mjs dev ${{ github.run_number }})" >> "$GITHUB_OUTPUT"
      - run: pnpm build
      - run: pnpm --recursive --filter "./packages/*" publish --tag dev --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: echo "Opublikowano **${{ steps.version.outputs.version }}** z oznaczeniem \`dev\`." >> "$GITHUB_STEP_SUMMARY"
